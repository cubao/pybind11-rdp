# This is a format job. Pre-commit has a first-party GitHub action, so we use
# that: https://github.com/pre-commit/action

name: Format

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
    - master

jobs:
  pre-commit:
    name: Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    # pyupgrade 2.31.1 (pinned in .pre-commit-config.yaml) crashes on
    # Python >= 3.12, where ast.Str was removed; pin like the sibling repos.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.9"
    - uses: pre-commit/action@v3.0.0
